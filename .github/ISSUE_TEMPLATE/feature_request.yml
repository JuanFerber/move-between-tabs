name: 💡 Feature Request
description: Suggest a new feature, command, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: What feature or shortcut would you like to see?
      placeholder: Describe the idea or new command you are proposing.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Use Case / Motivation
      placeholder: Why would this be useful to you and other users?
    validations:
      required: false
