name: Package & Release Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Extension ZIP & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Extension ZIP package
        run: |
          ZIP_NAME="move-between-tabs-${{ github.ref_name }}.zip"
          zip -r "$ZIP_NAME" manifest.json service-worker.js icons/ README.md LICENSE
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
